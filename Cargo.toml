[package]
name = "claw-rs"
version = "1.0.0"
edition = "2021"
description = "A working AI agent runtime inspired by claw-code, reimplemented from scratch in Rust"
license = "MIT"
authors = ["JSLEEKR <93jslee@gmail.com>"]

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
glob = "0.3"
regex = "1"
thiserror = "2"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
dirs = "6"
bytes = "1"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
